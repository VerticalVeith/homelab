apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: vintage-story
  namespace: vintage-story
spec:
  entryPoints:
    - vintage-story-tcp
  routes:
    - match: HostSNI(`*`)
      services:
        - name: vintage-story
          port: 42420
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteUDP
metadata:
  name: vintage-story
  namespace: vintage-story
spec:
  entryPoints:
    - vintage-story-udp
  routes:
    - services:
        - name: vintage-story
          port: 42420
